<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GapToGrowth Learning Hub</title>
<!--
  GapToGrowth Learning Hub shell, version 1.1.0 (lesson schema 1).
  This file is copied, never generated. It works offline when opened from a folder.
  It makes no network requests and loads no external scripts, fonts, or images.
  Data it reads (all local files next to this page):
    progress.js        window.G2G_PROGRESS  (saved progress, optional)
    content/index.js   window.G2G_FILES     (list of content files)
    content/*.js       pushes jobs, lessons, and addenda into window.G2G
  Data it writes: browser localStorage, and progress.js only when the user clicks a save button.
-->
<style>
  :root{
    --bg:#F6F4EC; --panel:#FFFFFF; --ink:#1B2430; --muted:#5B6472; --line:#DAD6C8;
    --green:#1F7A4D; --green-soft:#E3F4EA; --leaf:#34C77B; --amber:#B7790F; --amber-soft:#FBF1DC;
    --blue:#2563EB; --blue-soft:#E3ECFD; --red:#C2410C; --red-soft:#FCE7DC; --dark:#123D2A;
    --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05);
    --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"Cascadia Code",Consolas,"Courier New",monospace;
  }
  :root[data-theme="dark"]{
    --bg:#111714; --panel:#1A231E; --ink:#E7EEE9; --muted:#9FB0A6; --line:#2D3A33;
    --green:#4CC38A; --green-soft:#1D3328; --leaf:#4CC38A; --amber:#E2B04A; --amber-soft:#3A3020;
    --blue:#7AA2FF; --blue-soft:#1E2A44; --red:#FF8A5B; --red-soft:#3D2419; --dark:#0B2618;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111714; --panel:#1A231E; --ink:#E7EEE9; --muted:#9FB0A6; --line:#2D3A33;
      --green:#4CC38A; --green-soft:#1D3328; --leaf:#4CC38A; --amber:#E2B04A; --amber-soft:#3A3020;
      --blue:#7AA2FF; --blue-soft:#1E2A44; --red:#FF8A5B; --red-soft:#3D2419; --dark:#0B2618;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
  a{color:var(--green)}
  code{font-family:var(--mono);font-size:.92em;background:var(--green-soft);padding:1px 5px;border-radius:6px}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px}
  button:hover{border-color:var(--green)}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
  button.primary{background:var(--green);border-color:var(--green);color:#fff}
  button.primary:hover{filter:brightness(1.08)}
  button.small{padding:4px 10px;font-size:.88rem}
  .layout{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
  nav.side{background:var(--dark);color:#E7F5EC;padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{font-weight:800;font-size:1.3rem;margin:0 6px 4px}
  .brand span{color:var(--leaf)}
  .tag{font-size:.8rem;color:#9FC7B2;margin:0 6px 18px}
  .navlabel{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf);font-weight:700;margin:18px 6px 6px}
  .navlink{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;color:#E7F5EC;padding:7px 10px;border-radius:9px;font-size:.95rem}
  .navlink:hover{background:rgba(255,255,255,.08)}
  .navlink.active{background:var(--green);color:#fff}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:#5B6472}
  .dot.learning{background:var(--amber)} .dot.practiced{background:var(--blue)} .dot.ready{background:var(--leaf)}
  main{padding:26px clamp(16px,4vw,48px) 60px;max-width:980px;width:100%}
  .banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border-radius:var(--radius);margin-bottom:22px;border:1px solid var(--line)}
  .banner.ok{background:var(--green-soft);border-color:transparent}
  .banner.warn{background:var(--amber-soft);border-color:transparent}
  .banner .msg{flex:1 1 260px;font-weight:600}
  h1{font-size:1.9rem;line-height:1.2;margin:4px 0 6px}
  h2{font-size:1.25rem;margin:28px 0 10px}
  h3{font-size:1rem;margin:18px 0 6px}
  .sub{color:var(--muted);margin:0 0 18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:8px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .stat b{display:block;font-size:1.6rem}
  .stat span{color:var(--muted);font-size:.9rem}
  .gap{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
  .gap:first-child{border-top:0}
  .rank{flex:0 0 34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800}
  .gap .why{color:var(--muted);font-size:.93rem}
  .pill{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 10px;border-radius:99px;vertical-align:middle;margin-left:6px}
  .pill.A{background:var(--blue-soft);color:var(--blue)} .pill.B{background:var(--amber-soft);color:var(--amber)}
  .pill.full{background:var(--green-soft);color:var(--green)} .pill.card{background:var(--amber-soft);color:var(--amber)}
  .pill.req{background:var(--red-soft);color:var(--red)} .pill.pref{background:var(--line);color:var(--muted)}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ladder{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
  .ladder button{padding:6px 12px;font-size:.9rem}
  .ladder button.on{background:var(--green);border-color:var(--green);color:#fff}
  .hint{background:var(--green-soft);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.95rem}
  .note{background:var(--amber-soft);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.95rem}
  ul.claims{margin:6px 0 0;padding-left:20px}
  .flash{min-height:150px;display:grid;place-items:center;text-align:center;padding:22px;border-radius:var(--radius);border:2px dashed var(--line);cursor:pointer;user-select:none;background:var(--panel)}
  .flash .term{font-size:1.35rem;font-weight:800}
  .flash .def{font-size:1.02rem}
  .lab li{margin:6px 0;list-style:none}
  .lab label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
  .lab input{margin-top:5px;width:18px;height:18px;flex:0 0 auto}
  .lab ol{padding-left:0}
  .done{text-decoration:line-through;color:var(--muted)}
  .q{border-top:1px solid var(--line);padding:12px 0}
  .q:first-child{border-top:0}
  .opt{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
  .opt.right{color:var(--green);font-weight:700} .opt.wrong{color:var(--red)}
  .timer{font-family:var(--mono);font-size:1.6rem;font-weight:800}
  .timer.low{color:var(--red)}
  .story-part{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
  .story-part .hidden{color:var(--muted);font-style:italic}
  .steps li{margin:4px 0}
  .opt-box{border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:14px 0;background:var(--panel)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
  .modal.show{display:flex}
  .modal .card{max-width:640px;width:100%}
  .modal textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:.85rem;border-radius:10px;border:1px solid var(--line);padding:10px;background:var(--bg);color:var(--ink)}
  .muted{color:var(--muted)}
  .empty{text-align:center;padding:40px 10px;color:var(--muted)}
  .theme-btn{margin:20px 6px 0;background:transparent;color:#E7F5EC;border-color:rgba(255,255,255,.25);font-size:.85rem}
  .menu-btn{display:none}
  @media (max-width:820px){
    .layout{grid-template-columns:1fr}
    nav.side{position:fixed;inset:0 30% 0 0;height:100vh;z-index:25;transform:translateX(-105%);transition:transform .2s}
    nav.side.open{transform:none}
    .menu-btn{display:inline-block;margin-bottom:14px}
  }
  @media print{nav.side,.banner,.menu-btn,button{display:none!important}.layout{display:block}}
</style>
<script>
  // Containers that content files push into. Defined before any content loads.
  window.G2G = window.G2G || { jds: [], lessons: {}, addenda: [] };
  window.G2G_SHELL_VERSION = "1.1.0";
  window.G2G_SCHEMA_SUPPORTED = 1;
  (function(){ try{ var t=localStorage.getItem('g2g_theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){} })();
</script>
<script src="progress.js" onerror="window.G2G_PROGRESS_MISSING=true"></script>
<script src="content/index.js" onerror="window.G2G_INDEX_MISSING=true"></script>
</head>
<body>
<div class="layout">
  <nav class="side" id="side" aria-label="Learning Hub navigation">
    <div class="brand">Gap<span>To</span>Growth</div>
    <div class="tag">Learning Hub</div>
    <button class="navlink" data-go="#/dashboard">What to learn first</button>
    <button class="navlink" data-go="#/save">Save your progress</button>
    <div class="navlabel">Jobs</div>
    <div id="nav-jobs"></div>
    <div class="navlabel">Skills</div>
    <div id="nav-skills"></div>
    <button class="theme-btn" id="theme-btn" type="button">Switch light or dark</button>
  </nav>
  <main>
    <button class="menu-btn" id="menu-btn" type="button">Menu</button>
    <div id="banner"></div>
    <div id="view"><p class="muted">Loading your Learning Hub...</p></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="card">
    <h2 style="margin-top:0">Copy this text</h2>
    <p class="muted">Your browser blocked automatic copying. The text below is selected. Press <b>Ctrl+C</b> (Windows) or <b>Cmd+C</b> (Mac) to copy it.</p>
    <textarea id="modal-text" readonly></textarea>
    <div class="row" style="margin-top:10px"><button class="primary" id="modal-close" type="button">Done</button></div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ---------- Small helpers ---------- */
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
// Escapes text, keeps line breaks, and turns `backticks` into inline code.
function fmt(s){ return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>'); }
function idOf(name){ return String(name||'').toLowerCase().trim().replace(/\s+/g,' '); }
function safeUrl(u){ return /^https?:\/\//i.test(String(u||'')) ? u : null; }
function now(){ return new Date().toISOString(); }
function niceDate(iso){ if(!iso) return ''; var d=new Date(iso); return isNaN(d) ? iso : d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('show'); },2200); }
function list(arr){ return Array.isArray(arr) ? arr : []; }

/* ---------- Copy to clipboard with a manual fallback ---------- */
function copyText(text, okMsg){
  function manual(){ $('modal-text').value=text; $('modal').classList.add('show'); $('modal-text').focus(); $('modal-text').select(); }
  function legacy(){
    try{
      var ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); var ok=document.execCommand('copy'); document.body.removeChild(ta);
      if(ok){ toast(okMsg||'Copied!'); } else { manual(); }
    }catch(e){ manual(); }
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(function(){ toast(okMsg||'Copied!'); }, legacy);
  } else { legacy(); }
}
$('modal-close').onclick=function(){ $('modal').classList.remove('show'); };

/* ---------- Progress: browser storage + progress.js, newest entry wins ---------- */
var LS_KEY='g2g_progress_v1', LS_SAVED='g2g_last_saved';
function readLocal(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || null; }catch(e){ return null; } }
function writeLocal(p){ try{ localStorage.setItem(LS_KEY, JSON.stringify(p)); }catch(e){} }
function getSavedStamp(){ try{ return localStorage.getItem(LS_SAVED) || ''; }catch(e){ return ''; } }
function setSavedStamp(s){ try{ localStorage.setItem(LS_SAVED, s); }catch(e){} }
function blank(){ return { updated:'', skills:{} }; }

var fileP = (window.G2G_PROGRESS && typeof window.G2G_PROGRESS==='object') ? window.G2G_PROGRESS : null;
var localP = readLocal();
var P = mergeProgress(fileP, localP);
writeLocal(P);

function mergeProgress(a, b){
  a = a || blank(); b = b || blank();
  var out = blank(); var ids = {};
  Object.keys(a.skills||{}).forEach(function(k){ ids[k]=1; });
  Object.keys(b.skills||{}).forEach(function(k){ ids[k]=1; });
  Object.keys(ids).forEach(function(k){
    var x=(a.skills||{})[k], y=(b.skills||{})[k];
    out.skills[k] = !x ? y : !y ? x : ((y.updated||'') > (x.updated||'') ? y : x);
  });
  out.updated = (a.updated||'') > (b.updated||'') ? (a.updated||'') : (b.updated||'');
  return out;
}
function fileStamp(){ return fileP && fileP.updated ? fileP.updated : ''; }
function isSaved(){ var s = fileStamp() > getSavedStamp() ? fileStamp() : getSavedStamp(); return !P.updated || P.updated <= s; }
function sp(id){ return P.skills[id] || (P.skills[id] = { status:'not_started', lab:[], quizBest:null, updated:'' }); }
function touch(id){ var t=now(); sp(id).updated=t; P.updated=t; writeLocal(P); renderBanner(); renderNav(); }
function progressFileText(){ return 'window.G2G_PROGRESS = ' + JSON.stringify(P, null, 2) + ';\n'; }
function progressCode(){ return 'G2G-PROGRESS:' + JSON.stringify(P); }

/* ---------- Save to folder (Chrome and Edge), with a remembered file ---------- */
var canPickFile = ('showSaveFilePicker' in window) && window.isSecureContext;
function idb(){ return new Promise(function(res,rej){ var r=indexedDB.open('g2g',1); r.onupgradeneeded=function(){ r.result.createObjectStore('handles'); }; r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }); }
function idbGet(k){ return idb().then(function(db){ return new Promise(function(res){ var q=db.transaction('handles').objectStore('handles').get(k); q.onsuccess=function(){ res(q.result||null); }; q.onerror=function(){ res(null); }; }); }).catch(function(){ return null; }); }
function idbSet(k,v){ return idb().then(function(db){ return new Promise(function(res){ var t=db.transaction('handles','readwrite'); t.objectStore('handles').put(v,k); t.oncomplete=function(){ res(true); }; t.onerror=function(){ res(false); }; }); }).catch(function(){ return false; }); }
async function saveToFolder(){
  try{
    var handle = await idbGet('progress');
    if(handle){
      var perm = await handle.queryPermission({mode:'readwrite'});
      if(perm!=='granted'){ perm = await handle.requestPermission({mode:'readwrite'}); }
      if(perm!=='granted'){ handle=null; }
    }
    if(!handle){
      handle = await window.showSaveFilePicker({ suggestedName:'progress.js', id:'g2g-progress',
        types:[{ description:'GapToGrowth progress', accept:{ 'text/javascript':['.js'] } }] });
      await idbSet('progress', handle);
    }
    var w = await handle.createWritable(); await w.write(progressFileText()); await w.close();
    setSavedStamp(P.updated || now()); renderBanner(); toast('Progress saved to your folder.');
    if(currentRoute().name==='save') render();
  }catch(e){
    if(e && e.name==='AbortError') return;
    toast('Could not save. Try Copy my progress instead.');
  }
}
function downloadProgress(){
  var blob = new Blob([progressFileText()], {type:'text/javascript'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='progress.js';
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('Downloaded progress.js. Move it into your Learning Hub folder.');
}

/* ---------- Data ---------- */
var D = window.G2G;
function jobsSorted(){ return list(D.jds).slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }); }
function lessonIds(){ return Object.keys(D.lessons||{}).sort(function(a,b){ return lessonName(a).localeCompare(lessonName(b)); }); }
function lessonName(id){ var l=D.lessons[id]; return l && l.skill ? l.skill : id; }
function findLessonId(name){ var k=idOf(name); if(D.lessons[k]) return k; var hit=null; Object.keys(D.lessons).forEach(function(id){ if(idOf(D.lessons[id].skill)===k) hit=id; }); return hit; }

// Gap dashboard math: demand x gap weight. Required = 2, preferred or unknown = 1.
// Gap weight: B = 1, A = 0.5, Ready to claim = 0. Category comes from the most recent job.
function gaps(){
  var m={};
  jobsSorted().slice().reverse().forEach(function(j){
    list(j.keywords).forEach(function(kw){
      var id=idOf(kw.skill); if(!id) return;
      var g=m[id]||(m[id]={id:id,name:kw.skill,req:0,pref:0,unk:0,category:kw.category});
      if(kw.need==='required') g.req++; else if(kw.need==='preferred') g.pref++; else g.unk++;
      g.category=kw.category||g.category; g.name=kw.skill||g.name;
    });
  });
  return Object.keys(m).map(function(k){
    var g=m[k], lid=findLessonId(g.name)||k, st=(P.skills[lid]||{}).status||'not_started';
    var demand=g.req*2+g.pref+g.unk;
    var weight= st==='ready' ? 0 : (g.category==='A' ? 0.5 : 1);
    g.lesson=D.lessons[lid]?lid:null; g.status=st; g.demand=demand; g.score=demand*weight;
    return g;
  }).sort(function(a,b){ return b.score-a.score || b.req-a.req || a.name.localeCompare(b.name); });
}
var STATUS=[['not_started','Not started'],['learning','Learning'],['practiced','Practiced'],['ready','Ready to claim']];
function statusLabel(s){ var f=STATUS.filter(function(x){ return x[0]===s; })[0]; return f?f[1]:'Not started'; }
function plural(n,w){ return n+' '+w+(n===1?'':'s'); }

/* ---------- Routing ---------- */
function currentRoute(){
  var h=location.hash.replace(/^#\/?/,''); var parts=h.split('/');
  if(parts[0]==='skill' && parts[1]) return {name:'skill', id:decodeURIComponent(parts.slice(1).join('/'))};
  if(parts[0]==='job' && parts[1]) return {name:'job', id:decodeURIComponent(parts.slice(1).join('/'))};
  if(parts[0]==='save') return {name:'save'};
  return {name:'dashboard'};
}
window.addEventListener('hashchange', function(){ render(); $('side').classList.remove('open'); window.scrollTo(0,0); });
document.addEventListener('click', function(e){
  var go=e.target.closest('[data-go]'); if(go){ location.hash=go.getAttribute('data-go'); }
});
$('menu-btn').onclick=function(){ $('side').classList.toggle('open'); };
$('theme-btn').onclick=function(){
  var cur=document.documentElement.getAttribute('data-theme');
  var dark = cur ? cur==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  var next = dark ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme',next);
  try{ localStorage.setItem('g2g_theme',next); }catch(e){}
};

/* ---------- Banner and navigation ---------- */
function renderBanner(){
  var b=$('banner');
  if(isSaved()){
    b.innerHTML='<div class="banner ok"><div class="msg">All progress saved to your folder.</div></div>';
  } else {
    b.innerHTML='<div class="banner warn"><div class="msg">You have unsaved progress since '+esc(niceDate(P.updated))+'. Save it so it is safe and shows up in any browser.</div>'+
      '<button class="primary small" data-go="#/save" type="button">Save your progress</button></div>';
  }
}
function renderNav(){
  var r=currentRoute();
  document.querySelectorAll('nav .navlink[data-go="#/dashboard"],nav .navlink[data-go="#/save"]').forEach(function(el){
    el.classList.toggle('active', (r.name==='dashboard'&&el.getAttribute('data-go')==='#/dashboard')||(r.name==='save'&&el.getAttribute('data-go')==='#/save'));
  });
  $('nav-jobs').innerHTML = jobsSorted().map(function(j){
    return '<button class="navlink'+(r.name==='job'&&r.id===j.id?' active':'')+'" data-go="#/job/'+encodeURIComponent(j.id)+'" type="button">'+esc(j.role)+' | '+esc(j.company)+'</button>';
  }).join('') || '<div class="muted" style="padding:4px 10px;font-size:.9rem;color:#9FC7B2">No jobs yet</div>';
  $('nav-skills').innerHTML = lessonIds().map(function(id){
    var st=(P.skills[id]||{}).status||'not_started';
    return '<button class="navlink'+(r.name==='skill'&&r.id===id?' active':'')+'" data-go="#/skill/'+encodeURIComponent(id)+'" type="button"><span class="dot '+st+'" title="'+esc(statusLabel(st))+'"></span>'+esc(lessonName(id))+'</button>';
  }).join('') || '<div class="muted" style="padding:4px 10px;font-size:.9rem;color:#9FC7B2">No lessons yet</div>';
}

/* ---------- Views ---------- */
function render(){
  renderBanner(); renderNav();
  var r=currentRoute(), v=$('view');
  if(r.name==='save') v.innerHTML=viewSave();
  else if(r.name==='skill') v.innerHTML=viewSkill(r.id);
  else if(r.name==='job') v.innerHTML=viewJob(r.id);
  else v.innerHTML=viewDashboard();
  bind(r);
}

function viewDashboard(){
  var jobs=list(D.jds), ids=lessonIds();
  if(!jobs.length && !ids.length){
    return '<h1>Your Learning Hub is ready</h1><p class="sub">Lessons appear here after GapToGrowth reviews your first job description.</p>'+
      '<div class="card empty">No lessons yet. In Claude, paste a job description to get started.</div>';
  }
  var g=gaps(), top=g.filter(function(x){ return x.score>0; }).slice(0,8);
  var ready=ids.filter(function(id){ return (P.skills[id]||{}).status==='ready'; }).length;
  var html='<h1>What to learn first</h1><p class="sub">Ranked by how often your target jobs ask for each skill, and how far you are from claiming it.</p>'+
    '<div class="grid3"><div class="stat"><b>'+jobs.length+'</b><span>jobs analyzed</span></div>'+
    '<div class="stat"><b>'+ids.length+'</b><span>lessons</span></div>'+
    '<div class="stat"><b>'+ready+'</b><span>ready to claim</span></div></div>';
  html+='<div class="card">';
  if(!top.length){ html+='<p>Nothing left to prioritize. Every skill your jobs asked for is claimable or ready to claim. Nice work!</p>'; }
  top.forEach(function(x,i){
    var parts=[];
    if(x.req) parts.push('Required in '+plural(x.req,'job'));
    if(x.pref) parts.push('preferred in '+plural(x.pref,'job'));
    if(x.unk) parts.push('listed in '+plural(x.unk,(x.req||x.pref)?'other job':'job'));
    var why=parts.join(', '); why=why.charAt(0).toUpperCase()+why.slice(1)+'. '+statusLabel(x.status)+'.';
    if(x.category==='A') why+=' Partly claimable already.';
    html+='<div class="gap"><div class="rank">'+(i+1)+'</div><div style="flex:1"><b>'+esc(x.name)+'</b><span class="pill '+esc(x.category)+'">'+(x.category==='A'?'A: add + learn':'B: learn only')+'</span>'+
      '<div class="why">'+esc(why)+'</div></div>'+
      (x.lesson?'<button class="small" data-go="#/skill/'+encodeURIComponent(x.lesson)+'" type="button">Open lesson</button>':'<span class="muted" style="font-size:.88rem">No lesson yet</span>')+'</div>';
  });
  html+='</div><p class="muted" style="font-size:.88rem">How the ranking works: required counts 2 points and preferred counts 1 point per job. Learn-only skills count fully, partly claimable skills count half, and skills you mark Ready to claim drop off.</p>';
  return html;
}

function viewJob(id){
  var j=list(D.jds).filter(function(x){ return x.id===id; })[0];
  if(!j) return '<div class="card empty">This job could not be found.</div>';
  var rows=list(j.keywords).map(function(kw){
    var lid=findLessonId(kw.skill);
    return '<div class="gap"><div style="flex:1"><b>'+esc(kw.skill)+'</b><span class="pill '+esc(kw.category)+'">'+esc(kw.category)+'</span>'+
      (kw.need==='required'?'<span class="pill req">required</span>':kw.need==='preferred'?'<span class="pill pref">preferred</span>':'')+
      (kw.score!=null?'<div class="why">Evidence when reviewed: '+esc(kw.score)+'%</div>':'')+'</div>'+
      (lid?'<button class="small" data-go="#/skill/'+encodeURIComponent(lid)+'" type="button">Open lesson</button>':'')+'</div>';
  }).join('');
  var notes=list(D.addenda).filter(function(a){ return a.jd===id; }).map(function(a){
    var lid=findLessonId(a.skill);
    return '<li><b>'+esc(a.skill)+':</b> '+fmt(a.note)+(lid?' <a href="#/skill/'+encodeURIComponent(lid)+'">Open lesson</a>':'')+'</li>';
  }).join('');
  return '<h1>'+esc(j.role)+' | '+esc(j.company)+'</h1><p class="sub">'+esc(niceDate(j.date))+'</p>'+
    '<div class="card"><h2 style="margin-top:0">Skills to learn from this job</h2>'+(rows||'<p class="muted">No learning gaps were recorded for this job.</p>')+'</div>'+
    (notes?'<div class="card"><h2 style="margin-top:0">What this job added to existing lessons</h2><ul class="claims">'+notes+'</ul></div>':'');
}

function section(title, body){ return body ? '<h2>'+esc(title)+'</h2>'+body : ''; }
function para(t){ return t ? '<p>'+fmt(t)+'</p>' : ''; }
function bullets(a){ a=list(a).filter(Boolean); return a.length ? '<ul class="claims">'+a.map(function(x){ return '<li>'+fmt(x)+'</li>'; }).join('')+'</ul>' : ''; }

function viewSkill(id){
  var L=D.lessons[id];
  if(!L) return '<div class="card empty">This lesson could not be found.</div>';
  var s=sp(id), name=L.skill||id;
  var html='';
  if((L.schema||1) > window.G2G_SCHEMA_SUPPORTED){
    html+='<div class="note">This lesson was made by a newer version of GapToGrowth. In Claude, say <code>Upgrade my Learning Hub</code> to get the newest Learning Hub.</div>';
  }
  var origin=list(D.jds).filter(function(j){ return j.id===L.origin; })[0];
  html+='<h1>'+esc(name)+'<span class="pill '+(L.tier==='card'?'card':'full')+'">'+(L.tier==='card'?'Skill card':'Full lesson')+'</span></h1>'+
    '<p class="sub">'+(origin?'First seen in '+esc(origin.role)+' | '+esc(origin.company)+' | '+esc(niceDate(origin.date)):'')+'</p>';
  html+='<div class="card"><b>Your status</b><div class="ladder" role="group" aria-label="Skill status">'+
    STATUS.map(function(x){ return '<button type="button" class="'+(s.status===x[0]?'on':'')+'" data-status="'+x[0]+'">'+x[1]+'</button>'; }).join('')+'</div>'+
    '<div id="status-hint"></div>'+
    '<div class="row" style="margin-top:8px"><button type="button" class="small" data-copy="coach">Practice with Claude</button>'+
    (L.tier==='card'?'<button type="button" class="small primary" data-copy="expand">Expand with Claude</button>':'')+'</div>'+
    '<p class="muted" style="font-size:.88rem;margin:8px 0 0">These buttons copy a ready-made prompt. Paste it into Claude in your GapToGrowth task.</p></div>';

  html+=section('What it is', para(L.what));
  html+=section('Why employers need it', para(L.why));
  html+=section('Your transferable experience', para(L.transfer));
  html+=section('What you know and what to learn', para(L.knowVsNot));
  if(list(L.concepts).length){
    html+='<h2>Key concepts</h2><div id="flash"></div>';
  }
  if(list(L.resources).length){
    html+='<h2>Free resources</h2><ul class="claims">'+list(L.resources).map(function(r){
      var u=safeUrl(r.url); return '<li>'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(r.title||u)+'</a>':esc(r.title))+'</li>';
    }).join('')+'</ul>';
  }
  if(list(L.lab).length){
    html+='<h2>Hands-on lab</h2><div class="card lab"><ol id="lab"></ol><div class="muted" id="lab-count" style="font-size:.9rem"></div></div>';
  }
  html+=section('What you should be able to do after the lab', para(L.outcome));
  if(L.story && (L.story.situation||L.story.task||L.story.action||L.story.result)){
    html+='<h2>Rehearse your story</h2><p class="muted">Tell each part out loud from memory, then reveal it to check yourself.</p><div id="story"></div>';
  }
  html+=section(L.tier==='card'||!L.story?'How to talk about it honestly':'How to talk about it', para(L.talk));
  if(list(L.questions).length){
    html+='<h2>Mock interview</h2><div class="card" id="mock"></div>';
  }
  if(list(L.quiz).length){
    html+='<h2>Quick check</h2><div class="card" id="quiz"></div>';
  }
  list(L.extra).forEach(function(x){ html+=section(x.heading||'Notes', para(x.text)); });
  var ad=list(D.addenda).filter(function(a){ return idOf(a.skill)===id || findLessonId(a.skill)===id; });
  if(ad.length){
    html+='<h2>What other jobs emphasized</h2><ul class="claims">'+ad.map(function(a){
      var j=list(D.jds).filter(function(x){ return x.id===a.jd; })[0];
      return '<li><b>'+esc(j?j.role+' | '+j.company:a.jd)+':</b> '+fmt(a.note)+'</li>';
    }).join('')+'</ul>';
  }
  if(list(L.canClaim).length||list(L.mustNotClaim).length){
    html+='<h2>What you can and cannot claim</h2><div class="card">'+
      (list(L.canClaim).length?'<b style="color:var(--green)">You can claim</b>'+bullets(L.canClaim):'')+
      (list(L.mustNotClaim).length?'<b style="color:var(--red);display:block;margin-top:10px">Do not claim</b>'+bullets(L.mustNotClaim):'')+'</div>';
  }
  return html;
}

  var opt1 = canPickFile ?
    '<div class="opt-box"><h3 style="margin-top:0">Option 1: Save to folder (Chrome or Edge, quickest)</h3>'+
    '<p><b>First time:</b></p><ol class="steps"><li>Click <b>Save to folder</b>.</li><li>A save window opens. Go to your <b>GapToGrowth</b> folder, then open the <b>Learning Hub</b> folder.</li><li>Keep the file name <b>progress.js</b> and click <b>Save</b>.</li><li>If asked whether to replace the existing file, choose <b>Replace</b> (or <b>Yes</b>).</li><li>If your browser asks to let this page save changes, click <b>Allow</b>.</li></ol>'+
    '<p><b>Every time after that:</b> click <b>Save to folder</b>. If your browser asks for permission, click <b>Allow</b>. The banner turns green when it is done.</p>'+
    '<button class="primary" type="button" id="btn-save-folder">Save to folder</button></div>' : '';
  var opt2 =
    '<div class="opt-box"><h3 style="margin-top:0">'+(canPickFile?'Option 2':'Option 1')+': Copy my progress (any browser)</h3><ol class="steps">'+
    '<li>Click <b>Copy my progress</b>. You will see "Copied!"</li><li>Open Claude and go to your GapToGrowth task or project.</li>'+
    '<li>Paste into the message box (<b>Ctrl+V</b> on Windows, <b>Cmd+V</b> on Mac) and send. You do not need to type anything else.</li>'+
    '<li>Claude replies "Progress saved to Learning Hub/progress.js."</li><li>Reload this page (<b>F5</b> on Windows, <b>Cmd+R</b> on Mac). The banner turns green.</li></ol>'+
    '<button class="primary" type="button" id="btn-copy-progress">Copy my progress</button></div>';
  var opt3 = canPickFile ? '' :
    '<div class="opt-box"><h3 style="margin-top:0">Option 2: Download progress file</h3><ol class="steps">'+
    '<li>Click <b>Download progress file</b>.</li><li>Open your <b>Downloads</b> folder.</li>'+
    '<li>Move <b>progress.js</b> into <b>GapToGrowth/Learning Hub</b>. If asked, replace the old file.</li><li>Reload this page. The banner turns green.</li></ol>'+
    '<button type="button" id="btn-download">Download progress file</button></div>';
  return '<h1>Save your progress</h1><p class="sub">Your progress saves automatically in this browser. Saving it to your folder keeps it safe and makes it show up in any browser.</p>'+

    '<div class="card"><b>Using a different browser or computer?</b><p style="margin:6px 0 0">Open the same Learning Hub file and your saved progress loads automatically. Save again after practicing there. If your GapToGrowth folder is in a synced folder (such as OneDrive or Dropbox), your saved progress follows you to your other computers.</p></div>';
}

/* ---------- Interactive widgets ---------- */
function bind(r){
  var b;
  if(r.name==='save'){
    if((b=$('btn-save-folder'))) b.onclick=saveToFolder;
    if((b=$('btn-copy-progress'))) b.onclick=function(){ copyText(progressCode(),'Copied! Now paste it into Claude.'); };
    if((b=$('btn-download'))) b.onclick=downloadProgress;
    return;
  }
  if(r.name!=='skill') return;
  var id=r.id, L=D.lessons[id]; if(!L) return; var s=sp(id), name=L.skill||id;

  document.querySelectorAll('[data-status]').forEach(function(btn){
    btn.onclick=function(){ s.status=btn.getAttribute('data-status'); touch(id); render();
      if(s.status==='ready') toast('Marked Ready to claim. Save your progress so Claude can see it.'); };
  });
  document.querySelectorAll('[data-copy]').forEach(function(btn){
    btn.onclick=function(){
      var t = btn.getAttribute('data-copy')==='expand' ? 'Expand the '+name+' lesson in my Learning Hub.' : 'Coach me on '+name+' using my Learning Hub.';
      copyText(t,'Copied! Paste it into Claude.');
    };
  });

  function updateHint(){
    var h=$('status-hint'); if(!h) return;
    var labDone = list(L.lab).length ? list(L.lab).every(function(_,i){ return !!s.lab[i]; }) : false;
    var qn=list(L.quiz).length, passed = qn ? (s.quizBest!=null && s.quizBest >= Math.ceil(qn*2/3)) : true;
    if(labDone && passed && (s.status==='not_started'||s.status==='learning')){
      h.innerHTML='<div class="hint">You finished the lab'+(qn?' and passed the quick check':'')+'. Ready to mark this skill as Practiced? <button type="button" class="small primary" id="mark-practiced">Mark as Practiced</button></div>';
      $('mark-practiced').onclick=function(){ s.status='practiced'; touch(id); render(); };
    } else if(s.status==='ready'){
      h.innerHTML='<div class="hint">Next time you open Claude, GapToGrowth will ask before adding this skill to your Evidence Bank as lab or learning experience. Save your progress so it can see this.</div>';
    } else { h.innerHTML=''; }
  }
  updateHint();

  // Flashcards
  var concepts=list(L.concepts).filter(function(c){ return c && c.term; });
  if($('flash') && concepts.length){
    var fi=0, flipped=false;
    var drawFlash=function(){
      var c=concepts[fi];
      $('flash').innerHTML='<div class="flash" id="flash-card" tabindex="0" role="button" aria-label="Flip card">'+
        (flipped?'<div class="def">'+fmt(c.definition)+'</div>':'<div><div class="term">'+esc(c.term)+'</div><div class="muted" style="font-size:.85rem;margin-top:6px">Click to flip</div></div>')+'</div>'+
        '<div class="row" style="margin-top:8px"><button type="button" class="small" id="f-prev">Previous</button><span class="muted">Card '+(fi+1)+' of '+concepts.length+'</span><button type="button" class="small" id="f-next">Next</button></div>';
      var card=$('flash-card'); card.onclick=function(){ flipped=!flipped; drawFlash(); };
      card.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flipped=!flipped; drawFlash(); } };
      $('f-prev').onclick=function(){ fi=(fi-1+concepts.length)%concepts.length; flipped=false; drawFlash(); };
      $('f-next').onclick=function(){ fi=(fi+1)%concepts.length; flipped=false; drawFlash(); };
    };
    drawFlash();
  }

  // Lab checklist
  if($('lab')){
    var steps=list(L.lab);
    $('lab').innerHTML=steps.map(function(st,i){
      var codes=[]; String(st).replace(/`([^`]+)`/g,function(_,c){ codes.push(c); return _; });
      return '<li><label><input type="checkbox" data-lab="'+i+'"'+(s.lab[i]?' checked':'')+'><span class="'+(s.lab[i]?'done':'')+'"><b>Step '+(i+1)+'.</b> '+fmt(st)+'</span></label>'+
        (codes.length?'<div class="row" style="margin:4px 0 0 28px">'+codes.map(function(c,k){ return '<button type="button" class="small" data-code="'+i+'_'+k+'">Copy command'+(codes.length>1?' '+(k+1):'')+'</button>'; }).join('')+'</div>':'')+'</li>';
    }).join('');
    var count=function(){ var d=steps.filter(function(_,i){ return !!s.lab[i]; }).length; $('lab-count').textContent=d+' of '+steps.length+' steps done'; };
    count();
    $('lab').querySelectorAll('input[data-lab]').forEach(function(cb){
      cb.onchange=function(){ var i=+cb.getAttribute('data-lab'); s.lab[i]=cb.checked; cb.nextElementSibling.className=cb.checked?'done':''; touch(id); count(); updateHint();
        if(s.status==='not_started'&&cb.checked){ s.status='learning'; touch(id); render(); } };
    });
    $('lab').querySelectorAll('[data-code]').forEach(function(btn){
      btn.onclick=function(){ var p=btn.getAttribute('data-code').split('_'); var codes=[]; String(steps[+p[0]]).replace(/`([^`]+)`/g,function(_,c){ codes.push(c); return _; }); copyText(codes[+p[1]],'Command copied.'); };
    });
  }

  // Story rehearsal
  if($('story')){
    var parts=[['situation','Situation'],['task','Task'],['action','Action'],['result','Result']].filter(function(p){ return L.story[p[0]]; });
    $('story').innerHTML=parts.map(function(p,i){
      return '<div class="story-part"><b>'+p[1]+'</b><div id="sp-'+i+'"><span class="hidden">Hidden. Say it first, then reveal.</span> <button type="button" class="small" data-reveal="'+i+'">Reveal</button></div></div>';
    }).join('');
    $('story').querySelectorAll('[data-reveal]').forEach(function(btn){
      btn.onclick=function(){ var i=+btn.getAttribute('data-reveal'); $('sp-'+i).innerHTML=fmt(L.story[parts[i][0]]); };
    });
  }

  // Mock interview with a 2-minute timer
  if($('mock')){
    var qs=list(L.questions).filter(function(q){ return q && q.q; }), qi=0, timer=null, left=120;
    var stop=function(){ if(timer){ clearInterval(timer); timer=null; } };
    var drawMock=function(started, revealed){
      var q=qs[qi];
      if(!started){
        $('mock').innerHTML='<p>Practice answering out loud, like a real interview. You get 2 minutes per question.</p><button type="button" class="primary" id="m-start">Start mock interview</button> <span class="muted">'+plural(qs.length,'question')+'</span>';
        $('m-start').onclick=function(){ left=120; drawMock(true,false); stop(); timer=setInterval(function(){ left--; var t=$('m-timer'); if(!t){ stop(); return; } t.textContent=Math.floor(Math.max(left,0)/60)+':'+String(Math.max(left,0)%60).padStart(2,'0'); t.className='timer'+(left<=20?' low':''); if(left<=0){ stop(); t.textContent='Time is up'; } },1000); };
        return;
      }
      $('mock').innerHTML='<div class="row" style="justify-content:space-between"><span class="muted">Question '+(qi+1)+' of '+qs.length+'</span><span class="timer" id="m-timer">'+Math.floor(left/60)+':'+String(left%60).padStart(2,'0')+'</span></div>'+
        '<p style="font-size:1.15rem;font-weight:700">'+fmt(q.q)+'</p>'+
        (revealed?'<div class="hint"><b>A strong answer:</b><br>'+fmt(q.a)+(list(q.checklist).length?'<br><br><b>Did you cover these?</b>'+bullets(q.checklist):'')+'</div>':'<button type="button" class="primary" id="m-reveal">Reveal a strong answer</button> ')+
        '<button type="button" id="m-next">'+(qi<qs.length-1?'Next question':'Start over')+'</button>';
      var rv=$('m-reveal'); if(rv) rv.onclick=function(){ stop(); drawMock(true,true); };
      $('m-next').onclick=function(){ stop(); qi=(qi+1)%qs.length; left=120; drawMock(false,false); $('m-start').click(); };
    };
    if(qs.length) drawMock(false,false);
  }

  // Quick check quiz
  if($('quiz')){
    var qz=list(L.quiz).filter(function(q){ return q && q.q && list(q.options).length; });
    $('quiz').innerHTML=qz.map(function(q,i){
      return '<div class="q"><b>'+(i+1)+'. '+fmt(q.q)+'</b>'+list(q.options).map(function(o,k){
        return '<label class="opt" id="o-'+i+'-'+k+'"><input type="radio" name="qz-'+i+'" value="'+k+'"> <span>'+fmt(o)+'</span></label>';
      }).join('')+'<div id="ex-'+i+'"></div></div>';
    }).join('')+'<div class="row" style="margin-top:10px"><button type="button" class="primary" id="qz-check">Check my answers</button><span id="qz-score" class="muted"></span></div>'+
      (s.quizBest!=null?'<p class="muted" style="font-size:.9rem;margin:8px 0 0">Best score so far: '+s.quizBest+' of '+qz.length+'</p>':'');
    $('qz-check').onclick=function(){
      var score=0;
      qz.forEach(function(q,i){
        var pick=document.querySelector('input[name="qz-'+i+'"]:checked'); var k=pick?+pick.value:-1;
        list(q.options).forEach(function(_,j){ var el=$('o-'+i+'-'+j); el.classList.remove('right','wrong'); if(j===q.answer) el.classList.add('right'); else if(j===k) el.classList.add('wrong'); });
        if(k===q.answer) score++;
        $('ex-'+i).innerHTML=q.explain?'<div class="'+(k===q.answer?'hint':'note')+'">'+(k===q.answer?'Correct. ':'Not quite. ')+fmt(q.explain)+'</div>':'';
      });
      $('qz-score').textContent='You got '+score+' of '+qz.length+'.';
      if(s.quizBest==null || score>s.quizBest){ s.quizBest=score; }
      if(s.status==='not_started'){ s.status='learning'; }
      touch(id); updateHint();
    };
  }
}

/* ---------- Load content files, then render ---------- */
function loadContent(){
  var files = Array.isArray(window.G2G_FILES) ? window.G2G_FILES : [];
  return Promise.all(files.map(function(f){
    return new Promise(function(res){
      var sc=document.createElement('script'); sc.async=false; sc.src='content/'+String(f).replace(/^\/+/,'');  // async=false keeps index.js order, so later files can replace earlier lessons
      sc.onload=function(){ res(true); }; sc.onerror=function(){ console.warn('GapToGrowth: could not load content file', f); res(false); };
      document.head.appendChild(sc);
    });
  }));
}
loadContent().then(function(){
  // Normalize lesson keys so links are stable.
  var norm={}; Object.keys(D.lessons||{}).forEach(function(k){ var l=D.lessons[k]; norm[idOf(k)]=l; }); D.lessons=norm;
  render();
});
})();
